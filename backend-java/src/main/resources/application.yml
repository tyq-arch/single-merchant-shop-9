server:
  port: 8000
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: single-merchant-shop-backend
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.shop: INFO
